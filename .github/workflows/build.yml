# Compiles the mod on every push, so a broken commit is noticed before a release is tagged.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew build --no-daemon --console=plain
      - name: Keep the jars of this build
        uses: actions/upload-artifact@v4
        with:
          name: entity-303-jars
          path: |
            build/libs/*.jar
            ability-keys/build/libs/*.jar
            !build/libs/*-sources.jar
            !ability-keys/build/libs/*-sources.jar
