plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

version = project.mod_version

evaluationDependsOn(':ability-keys')
group = project.maven_group

loom {
	splitEnvironmentSourceSets()

	mods {
		"entity303" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"abilitykeys" {
			sourceSet project(':ability-keys').sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// the separate key-binding mod: Entity 303 cannot run without it (also declared in fabric.mod.json)
	implementation project(path: ':ability-keys', configuration: 'namedElements')
	// also packed inside the Entity 303 jar (jar-in-jar), so the self-updater of an old install brings it along; the same mod can
	// still be installed on its own (ability-keys-<version>.jar) and is then used instead of the packed copy
	include project(':ability-keys')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
